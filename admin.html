<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AUREA Admin</title><style>body{margin:0;background:#f5f3ee;font-family:Arial;color:#181716}header{background:#181716;color:white;padding:22px}main{max-width:1100px;margin:auto;padding:35px 20px}.login,.card{background:white;padding:28px;border:1px solid #ddd8cf;margin-bottom:20px}input,textarea{display:block;width:100%;padding:12px;margin:8px 0 15px;box-sizing:border-box}button{background:#181716;color:white;border:0;padding:12px 18px;cursor:pointer}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:15px}.stat{background:white;padding:20px;border:1px solid #ddd8cf}.stat b{display:block;font-size:28px;margin-top:8px}.hidden{display:none}table{width:100%;border-collapse:collapse;background:white}td,th{text-align:left;padding:12px;border-bottom:1px solid #eee;font-size:13px}@media(max-width:700px){.stats{grid-template-columns:1fr}table{font-size:11px}}</style></head><body><header><b>AUREA AI · ADMIN</b></header><main>
<div id="login" class="login"><h2>Entrar</h2><input id="u" placeholder="Usuário"><input id="p" type="password" placeholder="Senha"><button onclick="login()">Entrar</button><p id="err"></p></div>
<div id="panel" class="hidden"><button onclick="logout()">Sair</button><h1>Painel</h1><div class="stats"><div class="stat">Pedidos<b id="orders">0</b></div><div class="stat">Pagos<b id="paid">0</b></div><div class="stat">Faturamento<b id="rev">R$ 0,00</b></div></div><div class="card"><h2>Produtos</h2><div id="products"></div></div><div class="card"><h2>Pedidos</h2><div style="overflow:auto"><table><thead><tr><th>ID</th><th>Produto</th><th>Cliente</th><th>Valor</th><th>Status</th></tr></thead><tbody id="rows"></tbody></table></div></div></div>
</main><script>
async function me(){let r=await fetch("/api/admin/me"),d=await r.json();if(d.admin)show();}
function show(){loginBox.classList.add("hidden");panel.classList.remove("hidden");load()}
const loginBox=document.querySelector("#login"),panel=document.querySelector("#panel");
async function login(){let r=await fetch("/api/admin/login",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({user:u.value,password:p.value})});if(r.ok)show();else err.textContent="Login inválido";}
async function logout(){await fetch("/api/admin/logout",{method:"POST"});location.reload()}
async function load(){let s=await fetch("/api/admin/summary").then(r=>r.json());orders.textContent=s.orders;paid.textContent=s.paid;rev.textContent="R$ "+(s.revenue_cents/100).toFixed(2).replace(".",",");
let ps=await fetch("/api/admin/products").then(r=>r.json());products.innerHTML=ps.map(x=>`<p><b>${x.name}</b> — R$ ${(x.price_cents/100).toFixed(2).replace(".",",")} — ${x.active?"Ativo":"Inativo"}</p>`).join("");
let os=await fetch("/api/admin/orders").then(r=>r.json());rows.innerHTML=os.map(x=>`<tr><td>${x.id}</td><td>${x.product_name}</td><td>${x.buyer_email||"-"}</td><td>R$ ${(x.amount_cents/100).toFixed(2).replace(".",",")}</td><td>${x.status}</td></tr>`).join("")}
me();
</script></body></html>
